                    "spacing": {
                        "xs": "8px",

                        "container-max": "1440px",

                        "gutter": "20px"

                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-surface min-h-screen flex items-center justify-center relative overflow-hidden text-on-surface font-body-md">
<!-- Abstract Geometric Background via Detailed Prompt -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40 mix-blend-multiply" data-alt="A highly subtle, light-mode corporate background featuring faint, interconnected geometric nodes and delicate wireframe lines, symbolizing secure network infrastructure, institutional data protection, and quantitative analysis. The color palette is strictly off-white, pale silvery grays, and extremely faint icy blues, creating a clean, pristine, and unobtrusive canvas. The lighting is soft, diffuse, and uniform across the composition, ensuring maximum legibility for overlying user interface elements. The overall mood conveys calm authority, rigorous precision, and high-end enterprise security." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBGY-d51Yvkc-JAwOYW54bOL-t3zQGfEVz9USCAYovqxp5GM3D_EKzGREOrJYJiEvgI0qKVdWWgTR3Nppa1dAcSsHxf26g5nU0J1ZEv12HVAZXYfdiJMniCUF90P0ha2KCCKVnpD4Zv4-nD2XnqUBrisw51Yjubat3nmchBphTfU2DhnidAoshi_KPCbTXlbBlW2t3WYOh3D4n6B3Z--9MUHIS37no1KYyRttKEg9oozdvxC3Lxo9cy3Z61J9XhbKktsMA-oj-ShSZ8')"></div>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[420px] px-md">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.03)] p-lg w-full flex flex-col gap-lg">
<!-- Header & Logo -->
<div class="flex flex-col items-center text-center gap-sm">
<div class="w-16 h-16 bg-surface-container flex items-center justify-center rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-primary-container" data-icon="shield_lock" style="font-size: 32px;">shield_lock</span>
</div>
<div>
<h1 class="font-headline-md text-headline-md text-primary-container mb-base">RiskPulse</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Secure Enterprise Authentication</p>
</div>
</div>
<!-- Form Area -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="person" style="font-size: 18px;">person</span>
</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md rounded-DEFAULT focus:ring-2 focus:ring-primary-container/10 focus:border-primary-container block pl-xl pr-sm py-xs transition-colors" id="username" name="username" placeholder="Enter your username" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="key" style="font-size: 18px;">key</span>
</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md rounded-DEFAULT focus:ring-2 focus:ring-primary-container/10 focus:border-primary-container block pl-xl pr-sm py-xs transition-colors" id="password" name="password" placeholder="••••••••••••" required="" type="password">
</div>
</div>
<!-- Action Button -->
<button class="w-full flex justify-center py-[10px] px-sm border border-transparent rounded-DEFAULT shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-all mt-sm" type="submit">
                    Authenticate Session
                </button>
</form>
<!-- Footer Note -->
<div class="mt-xs text-center border-t border-outline-variant/50 pt-sm">
<p class="font-body-sm text-body-sm text-outline flex items-center justify-center gap-xs">
<span class="material-symbols-outlined" data-icon="info" style="font-size: 14px;">info</span>
                    Authorized personnel only.
                </p>
</div>
</div>
</main>
</body></html>
